services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_card
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d digital_card']
  
  migrate:
    build: .
    command: sh -c "npm run prisma:deploy && npm run prisma:seed"
    depends_on:
      db:
        condition: service_healthy
    env_file: 
      - .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digital_card
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    command: ["node", "dist/main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digital_card
    ports:
      - '3000:3000'

volumes:
  postgres_data:
