services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_card
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d digital_card']

  app:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digital_card
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run prisma:generate && npm run prisma:deploy && npm run prisma:seed && npm run start:dev"
    ports:
      - '3000:3000'

volumes:
  postgres_data:
